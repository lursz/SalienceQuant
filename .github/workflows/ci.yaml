name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: astral-sh/setup-uv@v5

  #     - name: Ruff lint
  #       run: uvx ruff@0.15.21 check src tests

  #     - name: Ruff format check
  #       run: uvx ruff@0.15.21 format --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      # tests are synthetic and never touch a GPU
      - name: Install dependencies
        run: |
          uv venv
          uv pip install --torch-backend=cpu -e . pytest

      - name: Run tests
        run: uv run --no-sync pytest tests/ -v