[project]
name = "kvcache"
version = "0.1.0"
description = "SalienceQuant: Salience-Driven Mixed-Precision KV Cache Quantization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.16.0",
    "accelerate>=0.25.0",
    "numpy>=1.24.0",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
